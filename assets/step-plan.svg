<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Staged entry plan screenshot</title>
  <desc id="desc">Annotated app screen showing budget split, stage shares, planned cost, profit, and loss checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#151b27"/><stop offset="1" stop-color="#07090f"/></linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0 13 6.5 0 13Z" fill="#1ee881"/></marker>
  </defs>
  <rect width="960" height="620" rx="34" fill="url(#bg)"/>
  <rect x="44" y="42" width="872" height="536" rx="28" fill="#0d121b" stroke="#ffffff24"/>
  <text x="80" y="92" fill="#f6f7fb" font-family="Inter,Arial" font-size="30" font-weight="800">Staged Fibonacci Trade Plan</text>
  <text x="80" y="124" fill="#a9b2c2" font-family="Inter,Arial" font-size="16">Step 4: turn the levels into a staged position plan</text>
  <rect x="80" y="154" width="330" height="342" rx="18" fill="#ffffff0d" stroke="#ffffff18"/>
  <text x="110" y="194" fill="#a9b2c2" font-family="Inter,Arial" font-size="15" font-weight="800">Investment Amount</text>
  <rect x="110" y="212" width="252" height="48" rx="12" fill="#080b10" stroke="#1ee88188"/>
  <text x="130" y="244" fill="#f6f7fb" font-family="Inter,Arial" font-size="24" font-weight="900">$10,000</text>
  <text x="110" y="304" fill="#a9b2c2" font-family="Inter,Arial" font-size="15" font-weight="800">Start Buying At</text>
  <rect x="110" y="322" width="252" height="48" rx="12" fill="#080b10" stroke="#4ca9ff88"/>
  <text x="130" y="354" fill="#f6f7fb" font-family="Inter,Arial" font-size="24" font-weight="900">38.2%</text>
  <text x="110" y="414" fill="#a9b2c2" font-family="Inter,Arial" font-size="15" font-weight="800">Target Price</text>
  <rect x="110" y="432" width="252" height="48" rx="12" fill="#080b10" stroke="#ffffff22"/>
  <text x="130" y="464" fill="#f6f7fb" font-family="Inter,Arial" font-size="24" font-weight="900">$196.00</text>
  <rect x="450" y="154" width="426" height="342" rx="18" fill="#ffffff0d" stroke="#ffffff18"/>
  <text x="480" y="194" fill="#f6f7fb" font-family="Inter,Arial" font-size="22" font-weight="900">Stage Table</text>
  <g font-family="Inter,Arial" font-size="14">
    <text x="480" y="232" fill="#a9b2c2" font-weight="800">Stage</text><text x="584" y="232" fill="#a9b2c2" font-weight="800">Price</text><text x="682" y="232" fill="#a9b2c2" font-weight="800">Shares</text><text x="784" y="232" fill="#a9b2c2" font-weight="800">Cost</text>
    <path d="M480 248H844" stroke="#ffffff22"/>
    <text x="480" y="282" fill="#4ca9ff" font-weight="900">38.2%</text><text x="584" y="282" fill="#f6f7fb">$168.50</text><text x="708" y="282" fill="#f6f7fb">14</text><text x="784" y="282" fill="#f6f7fb">$2,359</text>
    <text x="480" y="326" fill="#1ee881" font-weight="900">50%</text><text x="584" y="326" fill="#f6f7fb">$160.00</text><text x="708" y="326" fill="#f6f7fb">15</text><text x="784" y="326" fill="#f6f7fb">$2,400</text>
    <text x="480" y="370" fill="#ffb238" font-weight="900">61.8%</text><text x="584" y="370" fill="#f6f7fb">$151.50</text><text x="708" y="370" fill="#f6f7fb">16</text><text x="784" y="370" fill="#f6f7fb">$2,424</text>
    <text x="480" y="414" fill="#ff8b38" font-weight="900">78.6%</text><text x="584" y="414" fill="#f6f7fb">$139.40</text><text x="708" y="414" fill="#f6f7fb">20</text><text x="784" y="414" fill="#f6f7fb">$2,788</text>
  </g>
  <path d="M394 240 C430 246 438 252 472 270" fill="none" stroke="#1ee881" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="80" y="522" width="796" height="44" rx="12" fill="#07120f" stroke="#1ee88155"/>
  <text x="108" y="550" fill="#dce8e8" font-family="Inter,Arial" font-size="16">
    Shares = floor((Investment ÷ selected stages) ÷ stage price). Remaining cash is added to the cheapest stages.
  </text>
</svg>
