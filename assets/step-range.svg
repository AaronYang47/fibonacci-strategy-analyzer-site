<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Set range step screenshot</title>
  <desc id="desc">Annotated app screen showing swing high, swing low, direction, and Fibonacci formula.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#151b27"/><stop offset="1" stop-color="#07090f"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#101826"/><stop offset="1" stop-color="#0b111a"/></linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0 13 6.5 0 13Z" fill="#42d4ff"/></marker>
  </defs>
  <rect width="960" height="620" rx="34" fill="url(#bg)"/>
  <rect x="48" y="42" width="864" height="536" rx="28" fill="#0d121b" stroke="#ffffff24"/>
  <text x="84" y="92" fill="#f6f7fb" font-family="Inter,Arial" font-size="30" font-weight="800">Parameter Setup</text>
  <text x="84" y="124" fill="#a9b2c2" font-family="Inter,Arial" font-size="16">Step 2: define the price range your analysis is based on</text>
  <rect x="84" y="156" width="372" height="332" rx="18" fill="url(#panel)" stroke="#ffffff18"/>
  <text x="116" y="196" fill="#a9b2c2" font-family="Inter,Arial" font-size="15" font-weight="800">Direction</text>
  <rect x="116" y="212" width="142" height="42" rx="11" fill="#1ee88122" stroke="#1ee88188"/>
  <text x="148" y="239" fill="#1ee881" font-family="Inter,Arial" font-size="16" font-weight="900">Pullback</text>
  <rect x="272" y="212" width="142" height="42" rx="11" fill="#ffffff0a" stroke="#ffffff18"/>
  <text x="314" y="239" fill="#a9b2c2" font-family="Inter,Arial" font-size="16" font-weight="800">Rebound</text>
  <text x="116" y="296" fill="#a9b2c2" font-family="Inter,Arial" font-size="15" font-weight="800">Swing High</text>
  <rect x="116" y="312" width="298" height="48" rx="12" fill="#080b10" stroke="#1ee88188"/>
  <text x="136" y="344" fill="#f6f7fb" font-family="Inter,Arial" font-size="22" font-weight="900">$196.00</text>
  <text x="116" y="396" fill="#a9b2c2" font-family="Inter,Arial" font-size="15" font-weight="800">Swing Low</text>
  <rect x="116" y="412" width="298" height="48" rx="12" fill="#080b10" stroke="#ff476288"/>
  <text x="136" y="444" fill="#f6f7fb" font-family="Inter,Arial" font-size="22" font-weight="900">$124.00</text>
  <path d="M504 334 C558 328 596 300 642 254" fill="none" stroke="#42d4ff" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="618" y="144" width="258" height="120" rx="18" fill="#0b1b24" stroke="#42d4ff88"/>
  <text x="642" y="178" fill="#42d4ff" font-family="Inter,Arial" font-size="16" font-weight="900">Formula used</text>
  <text x="642" y="212" fill="#f6f7fb" font-family="Inter,Arial" font-size="18" font-weight="800">Pullback level</text>
  <text x="642" y="240" fill="#dce8e8" font-family="Inter,Arial" font-size="16">High - (High - Low) × %</text>
  <rect x="520" y="304" width="356" height="184" rx="18" fill="#ffffff0d" stroke="#ffffff16"/>
  <text x="550" y="340" fill="#a9b2c2" font-family="Inter,Arial" font-size="15" font-weight="800">Example</text>
  <text x="550" y="380" fill="#f6f7fb" font-family="Inter,Arial" font-size="22" font-weight="900">38.2% = 196 - (72 × 0.382)</text>
  <text x="550" y="420" fill="#1ee881" font-family="Inter,Arial" font-size="30" font-weight="900">$168.50</text>
  <text x="550" y="456" fill="#dce8e8" font-family="Inter,Arial" font-size="16">Use Rebound when measuring upward from a low.</text>
  <rect x="84" y="514" width="792" height="34" rx="10" fill="#ffffff0a"/>
  <text x="112" y="537" fill="#a9b2c2" font-family="Inter,Arial" font-size="15">Best practice: use a recent, obvious swing high and swing low from the timeframe you plan to trade.</text>
</svg>
