<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Search stock step screenshot</title>
  <desc id="desc">Annotated app screen showing the stock search field and market selector.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#151b27"/><stop offset="1" stop-color="#07090f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#1ee881"/><stop offset="1" stop-color="#42d4ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".38"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0 13 6.5 0 13Z" fill="#1ee881"/></marker>
  </defs>
  <rect width="960" height="620" rx="34" fill="url(#bg)"/>
  <rect x="46" y="42" width="868" height="536" rx="28" fill="#0d121b" stroke="#ffffff24" filter="url(#shadow)"/>
  <text x="82" y="92" fill="#f6f7fb" font-family="Inter,Arial" font-size="30" font-weight="800">Fibonacci Strategy Analyzer</text>
  <text x="82" y="124" fill="#a9b2c2" font-family="Inter,Arial" font-size="16">Step 1: load the stock you want to analyze</text>
  <rect x="82" y="158" width="796" height="96" rx="16" fill="#ffffff10" stroke="#ffffff18"/>
  <text x="112" y="194" fill="#a9b2c2" font-family="Inter,Arial" font-size="15" font-weight="700">Stock Search</text>
  <rect x="112" y="210" width="342" height="38" rx="10" fill="#080b10" stroke="#4ca9ff88"/>
  <text x="130" y="235" fill="#f6f7fb" font-family="Inter,Arial" font-size="17" font-weight="800">AAPL</text>
  <rect x="474" y="210" width="210" height="38" rx="10" fill="#101722" stroke="#ffffff20"/>
  <text x="500" y="235" fill="#f6f7fb" font-family="Inter,Arial" font-size="15" font-weight="750">Market: US</text>
  <rect x="704" y="210" width="134" height="38" rx="10" fill="url(#accent)"/>
  <text x="738" y="235" fill="#061014" font-family="Inter,Arial" font-size="15" font-weight="900">Search</text>
  <path d="M690 124 C652 162 626 190 580 211" fill="none" stroke="#1ee881" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="574" y="76" width="276" height="66" rx="16" fill="#10251f" stroke="#1ee88199"/>
  <text x="596" y="103" fill="#1ee881" font-family="Inter,Arial" font-size="15" font-weight="900">1. Enter ticker</text>
  <text x="596" y="126" fill="#dce8e8" font-family="Inter,Arial" font-size="14">Pick the market before loading data.</text>
  <rect x="82" y="286" width="242" height="112" rx="16" fill="#ffffff0d" stroke="#ffffff16"/>
  <text x="106" y="322" fill="#a9b2c2" font-family="Inter,Arial" font-size="14" font-weight="700">Current Price</text>
  <text x="106" y="364" fill="#f6f7fb" font-family="Inter,Arial" font-size="36" font-weight="900">$171.05</text>
  <rect x="350" y="286" width="242" height="112" rx="16" fill="#ffffff0d" stroke="#ffffff16"/>
  <text x="374" y="322" fill="#a9b2c2" font-family="Inter,Arial" font-size="14" font-weight="700">Close</text>
  <text x="374" y="364" fill="#1ee881" font-family="Inter,Arial" font-size="36" font-weight="900">$171.05</text>
  <rect x="618" y="286" width="260" height="112" rx="16" fill="#ffffff0d" stroke="#ffffff16"/>
  <text x="642" y="322" fill="#a9b2c2" font-family="Inter,Arial" font-size="14" font-weight="700">Timeframe</text>
  <text x="642" y="364" fill="#f6f7fb" font-family="Inter,Arial" font-size="36" font-weight="900">Daily</text>
  <rect x="82" y="430" width="796" height="98" rx="16" fill="#07120f" stroke="#1ee88155"/>
  <text x="112" y="462" fill="#1ee881" font-family="Inter,Arial" font-size="16" font-weight="900">What to check</text>
  <text x="112" y="493" fill="#dce8e8" font-family="Inter,Arial" font-size="18">After loading data, confirm the Current Price and latest Close are filled before planning entries.</text>
</svg>
