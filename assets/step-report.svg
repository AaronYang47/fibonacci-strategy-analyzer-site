<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Save and export report screenshot</title>
  <desc id="desc">Annotated app screen showing Save PDF, Print, Records, and report summary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#151b27"/><stop offset="1" stop-color="#07090f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#1ee881"/><stop offset="1" stop-color="#42d4ff"/></linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0 13 6.5 0 13Z" fill="#42d4ff"/></marker>
  </defs>
  <rect width="960" height="620" rx="34" fill="url(#bg)"/>
  <rect x="44" y="42" width="872" height="536" rx="28" fill="#0d121b" stroke="#ffffff24"/>
  <text x="80" y="92" fill="#f6f7fb" font-family="Inter,Arial" font-size="30" font-weight="800">Save, Records, and PDF Reports</text>
  <text x="80" y="124" fill="#a9b2c2" font-family="Inter,Arial" font-size="16">Step 5: keep the setup and export a clean report</text>
  <rect x="80" y="154" width="352" height="342" rx="18" fill="#ffffff0d" stroke="#ffffff18"/>
  <text x="112" y="196" fill="#f6f7fb" font-family="Inter,Arial" font-size="22" font-weight="900">Toolbar Actions</text>
  <rect x="112" y="226" width="128" height="42" rx="12" fill="url(#accent)"/>
  <text x="154" y="253" fill="#061014" font-family="Inter,Arial" font-size="15" font-weight="900">Save</text>
  <rect x="256" y="226" width="128" height="42" rx="12" fill="#ffffff10" stroke="#ffffff22"/>
  <text x="288" y="253" fill="#f6f7fb" font-family="Inter,Arial" font-size="15" font-weight="900">Save PDF</text>
  <rect x="112" y="292" width="128" height="42" rx="12" fill="#ffffff10" stroke="#ffffff22"/>
  <text x="151" y="319" fill="#f6f7fb" font-family="Inter,Arial" font-size="15" font-weight="900">Print</text>
  <rect x="256" y="292" width="128" height="42" rx="12" fill="#ffffff10" stroke="#ffffff22"/>
  <text x="292" y="319" fill="#f6f7fb" font-family="Inter,Arial" font-size="15" font-weight="900">Records</text>
  <path d="M398 248 C456 248 466 278 504 306" fill="none" stroke="#42d4ff" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="510" y="154" width="366" height="342" rx="18" fill="#f6f7fb" stroke="#ffffff22"/>
  <text x="540" y="196" fill="#111827" font-family="Inter,Arial" font-size="22" font-weight="900">Fibonacci Strategy Report</text>
  <text x="540" y="224" fill="#5f6675" font-family="Inter,Arial" font-size="14" font-weight="800">AAPL · Pullback · Daily</text>
  <rect x="540" y="252" width="136" height="72" rx="12" fill="#e9eef6"/><text x="558" y="278" fill="#667085" font-family="Inter,Arial" font-size="12" font-weight="800">Investment</text><text x="558" y="306" fill="#111827" font-family="Inter,Arial" font-size="20" font-weight="900">$10,000</text>
  <rect x="698" y="252" width="136" height="72" rx="12" fill="#e9eef6"/><text x="716" y="278" fill="#667085" font-family="Inter,Arial" font-size="12" font-weight="800">Target Profit</text><text x="716" y="306" fill="#0b9b55" font-family="Inter,Arial" font-size="20" font-weight="900">$2,314</text>
  <rect x="540" y="350" width="294" height="100" rx="12" fill="#111827"/>
  <text x="560" y="382" fill="#f6f7fb" font-family="Inter,Arial" font-size="15" font-weight="900">Report includes</text>
  <text x="560" y="412" fill="#cbd5e1" font-family="Inter,Arial" font-size="14">Levels, shares, cost, target profit,</text>
  <text x="560" y="436" fill="#cbd5e1" font-family="Inter,Arial" font-size="14">loss checks, and calculation notes.</text>
  <rect x="80" y="522" width="796" height="44" rx="12" fill="#0b1b24" stroke="#42d4ff55"/>
  <text x="108" y="550" fill="#dce8e8" font-family="Inter,Arial" font-size="16">Use Records when comparing multiple saved setups; use PDF when sharing or archiving a single plan.</text>
</svg>
