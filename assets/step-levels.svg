<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Read Fibonacci Levels screenshot</title>
  <desc id="desc">Annotated app screen showing chart, current price line, and Fibonacci Levels list.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#151b27"/><stop offset="1" stop-color="#07090f"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#e4c8ff"/><stop offset=".55" stop-color="#a35cff"/><stop offset="1" stop-color="#6c42ff"/></linearGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0 13 6.5 0 13Z" fill="#a35cff"/></marker>
  </defs>
  <rect width="960" height="620" rx="34" fill="url(#bg)"/>
  <rect x="44" y="42" width="872" height="536" rx="28" fill="#0d121b" stroke="#ffffff24"/>
  <text x="80" y="92" fill="#f6f7fb" font-family="Inter,Arial" font-size="30" font-weight="800">Chart + Fibonacci Levels</text>
  <text x="80" y="124" fill="#a9b2c2" font-family="Inter,Arial" font-size="16">Step 3: see where the current price sits relative to each retracement</text>
  <rect x="80" y="154" width="504" height="356" rx="18" fill="#090d14" stroke="#ffffff18"/>
  <g stroke="#ffffff12"><path d="M104 230H560"/><path d="M104 306H560"/><path d="M104 382H560"/><path d="M104 458H560"/></g>
  <path d="M104 236H560" stroke="#4ca9ff" stroke-width="2"/><text x="490" y="226" fill="#4ca9ff" font-family="Inter,Arial" font-size="13" font-weight="800">38.2%</text>
  <path d="M104 322H560" stroke="#1ee881" stroke-width="2"/><text x="500" y="312" fill="#1ee881" font-family="Inter,Arial" font-size="13" font-weight="800">50%</text>
  <path d="M104 406H560" stroke="#ffb238" stroke-width="2"/><text x="490" y="396" fill="#ffb238" font-family="Inter,Arial" font-size="13" font-weight="800">61.8%</text>
  <path d="M104 278H560" stroke="#ff4762" stroke-width="2" stroke-dasharray="10 8"/>
  <circle cx="332" cy="278" r="8" fill="#ff4762" stroke="#fff" stroke-width="2"/>
  <text x="118" y="272" fill="#ff4762" font-family="Inter,Arial" font-size="14" font-weight="900">Current</text>
  <g>
    <rect x="144" y="362" width="16" height="68" rx="3" fill="#1ee881"/><path d="M152 334V452" stroke="#1ee881" stroke-width="2"/>
    <rect x="214" y="294" width="16" height="104" rx="3" fill="#ff4762"/><path d="M222 260V424" stroke="#ff4762" stroke-width="2"/>
    <rect x="284" y="318" width="16" height="84" rx="3" fill="#1ee881"/><path d="M292 288V426" stroke="#1ee881" stroke-width="2"/>
    <rect x="354" y="248" width="16" height="132" rx="3" fill="#1ee881"/><path d="M362 218V406" stroke="#1ee881" stroke-width="2"/>
    <rect x="424" y="260" width="16" height="110" rx="3" fill="#ff4762"/><path d="M432 232V390" stroke="#ff4762" stroke-width="2"/>
  </g>
  <rect x="622" y="154" width="254" height="356" rx="18" fill="#ffffff0d" stroke="#ffffff18"/>
  <text x="650" y="194" fill="#f6f7fb" font-family="Inter,Arial" font-size="22" font-weight="900">Fibonacci Levels</text>
  <g font-family="Inter,Arial" font-size="15" font-weight="800">
    <circle cx="656" cy="238" r="6" fill="#4ca9ff"/><text x="676" y="244" fill="#f6f7fb">38.2%</text><text x="796" y="244" fill="#a9b2c2">$168.50</text>
    <circle cx="656" cy="286" r="6" fill="#1ee881"/><text x="676" y="292" fill="#f6f7fb">50%</text><text x="796" y="292" fill="#a9b2c2">$160.00</text>
    <rect x="650" y="324" width="12" height="12" rx="3" fill="url(#purple)" transform="rotate(45 656 330)"/><text x="676" y="336" fill="#a35cff">Current Price</text><text x="796" y="336" fill="#a35cff">$171.05</text>
    <circle cx="656" cy="382" r="6" fill="#ffb238"/><text x="676" y="388" fill="#f6f7fb">61.8%</text><text x="796" y="388" fill="#a9b2c2">$151.50</text>
  </g>
  <path d="M610 334 C566 334 548 306 514 282" fill="none" stroke="#a35cff" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="588" y="526" width="288" height="40" rx="12" fill="#211333" stroke="#a35cff88"/>
  <text x="612" y="552" fill="#f6f7fb" font-family="Inter,Arial" font-size="15">Purple row = live current price marker</text>
</svg>
